name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Relais.apk

      - name: Keep the APK of every build
        uses: actions/upload-artifact@v4
        with:
          name: Relais
          path: Relais.apk

      - name: Release text from the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          log="fastlane/metadata/android/en-US/changelogs/${code}.txt"
          { if [ -f "$log" ]; then cat "$log"; echo; fi; echo "APK to install on your phone."; } > release_body.txt
          cat release_body.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Relais ${{ github.ref_name }}
          body_path: release_body.txt
          files: Relais.apk
          make_latest: true
